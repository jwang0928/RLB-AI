query Find_Datasources_LUID {
	    tableauSites {
    		name
        publishedDatasources(filter: { name: "RLB Data Dictionary Temp"}) {
            name
      			projectName
            description
            luid
            uri
            owner {
            username
            name
            email
            }
            hasActiveWarning
            extractLastRefreshTime
            extractLastIncrementalUpdateTime
            extractLastUpdateTime
            
        }
		}
}

query GetAllDatasources {
  tableauSites {
    name
    publishedDatasources {
      name
      luid
      projectName
    }
  }
}